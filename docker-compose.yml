services:
  hdf5-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      HDF5_DATA_DIR: /data
      STATIC_DIR: /app/public
      LOG_FORMAT: json
      CORS_ORIGINS: "*"
    volumes:
      - ${HDF5_DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 8
